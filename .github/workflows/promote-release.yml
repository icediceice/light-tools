name: Promote release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful release-candidate workflow run ID
        required: true
        type: string
      version:
        description: Candidate version, with or without a leading v
        required: true
        type: string
      expected_checksums_sha256:
        description: SHA-256 of checksums.txt copied from the green candidate run
        required: true
        type: string
      publish_npm:
        description: Publish the seven checksum-bound npm packages after GitHub promotion
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: promote-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate candidate run through the Actions API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHECKSUMS_SHA256: ${{ inputs.expected_checksums_sha256 }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "invalid release version: $version" >&2
            exit 1
          fi
          if ! [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "candidate_run_id must contain only digits" >&2
            exit 1
          fi
          expected_checksums_sha256="$(printf '%s' "$INPUT_CHECKSUMS_SHA256" | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$expected_checksums_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "expected_checksums_sha256 must be a 64-character SHA-256 digest" >&2
            exit 1
          fi

          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > candidate-run.json

          require_equal() {
            if [ "$1" != "$2" ]; then
              echo "$3: expected '$2', got '$1'" >&2
              exit 1
            fi
          }

          require_equal "$(jq -r .status candidate-run.json)" "completed" "candidate status"
          require_equal "$(jq -r .conclusion candidate-run.json)" "success" "candidate conclusion"
          require_equal "$(jq -r .event candidate-run.json)" "workflow_dispatch" "candidate event"
          require_equal "$(jq -r .head_branch candidate-run.json)" "$default_branch" "candidate branch"
          require_equal "$(jq -r .path candidate-run.json)" ".github/workflows/release.yml" "candidate workflow"

          tested_sha="$(jq -r .head_sha candidate-run.json)"
          run_attempt="$(jq -r .run_attempt candidate-run.json)"
          if ! [[ "$tested_sha" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$run_attempt" =~ ^[0-9]+$ ]]; then
            echo "candidate run returned malformed SHA or attempt metadata" >&2
            exit 1
          fi

          compare_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$default_branch...$tested_sha" --jq .status)"
          case "$compare_status" in
            identical|behind) ;;
            *)
              echo "candidate SHA is no longer reachable from $default_branch: $compare_status" >&2
              exit 1
              ;;
          esac

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/attempts/$run_attempt/jobs?per_page=100" > candidate-jobs.json
          expected_smokes=(
            smoke-linux_amd64
            smoke-linux_arm64
            smoke-darwin_amd64
            smoke-darwin_arm64
            smoke-windows_amd64
            smoke-windows_arm64
          )
          smoke_count="$(jq '[.jobs[] | select(.name | startswith("smoke-"))] | length' candidate-jobs.json)"
          require_equal "$smoke_count" "6" "smoke job count"
          for smoke in "${expected_smokes[@]}"; do
            success_count="$(
              jq --arg name "$smoke" '[.jobs[] | select(.name == $name and .conclusion == "success")] | length' candidate-jobs.json
            )"
            require_equal "$success_count" "1" "$smoke successful job count"
          done

          {
            echo "VERSION=$version"
            echo "TAG=v$version"
            echo "TESTED_SHA=$tested_sha"
            echo "RUN_ATTEMPT=$run_attempt"
            echo "EXPECTED_CHECKSUMS_SHA256=$expected_checksums_sha256"
            echo "ARTIFACT_NAME=release-$version-${CANDIDATE_RUN_ID}-$run_attempt"
          } >> "$GITHUB_ENV"

      - name: Download the exact run-bound candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          name: ${{ env.ARTIFACT_NAME }}
          path: release

      - name: Verify candidate filenames and bytes
        shell: bash
        run: |
          set -euo pipefail

          actual_checksums_sha256="$(sha256sum release/checksums.txt | cut -d' ' -f1)"
          if [ "$actual_checksums_sha256" != "$EXPECTED_CHECKSUMS_SHA256" ]; then
            echo "checksums.txt digest mismatch: expected $EXPECTED_CHECKSUMS_SHA256, got $actual_checksums_sha256" >&2
            exit 1
          fi

          expected_assets=(
            "light-tools_${VERSION}_darwin_amd64.tar.gz"
            "light-tools_${VERSION}_darwin_arm64.tar.gz"
            "light-tools_${VERSION}_linux_amd64.tar.gz"
            "light-tools_${VERSION}_linux_arm64.tar.gz"
            "light-tools_${VERSION}_windows_amd64.zip"
            "light-tools_${VERSION}_windows_arm64.zip"
            "factor-i-o-light-tools-darwin-arm64-${VERSION}.tgz"
            "factor-i-o-light-tools-darwin-x64-${VERSION}.tgz"
            "factor-i-o-light-tools-linux-arm64-${VERSION}.tgz"
            "factor-i-o-light-tools-linux-x64-${VERSION}.tgz"
            "factor-i-o-light-tools-win32-arm64-${VERSION}.tgz"
            "factor-i-o-light-tools-win32-x64-${VERSION}.tgz"
            "factor-i-o-light-tools-${VERSION}.tgz"
          )
          printf '%s\n' "${expected_assets[@]}" | sort > expected-assets.txt
          find release -maxdepth 1 -type f -printf '%f\n' | sort > actual-files.txt
          { cat expected-assets.txt; echo checksums.txt; } | sort > expected-files.txt
          diff -u expected-files.txt actual-files.txt
          awk '{print $2}' release/checksums.txt | sed 's/^\*//' | sort > manifest-assets.txt
          diff -u expected-assets.txt manifest-assets.txt
          test "$(wc -l < release/checksums.txt)" -eq 13
          (cd release && sha256sum --strict -c checksums.txt)

      - name: Atomically create the tested tag and publish exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail

          exact_count="$(
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" |
              jq --arg ref "refs/tags/$TAG" '[.[] | select(.ref == $ref)] | length'
          )"
          if [ "$exact_count" -ne 0 ]; then
            echo "tag already exists: $TAG" >&2
            exit 1
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$TESTED_SHA"

          printf -v notes 'Promoted from candidate run %s attempt %s.\nTested commit: %s\nchecksums.txt SHA-256: %s' "$CANDIDATE_RUN_ID" "$RUN_ATTEMPT" "$TESTED_SHA" "$EXPECTED_CHECKSUMS_SHA256"
          release_flags=(--verify-tag --notes "$notes")
          if [[ "$VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG" "${release_flags[@]}" release/*

          {
            echo "### Published $TAG"
            echo
            echo "- Candidate run: \`$CANDIDATE_RUN_ID\` attempt \`$RUN_ATTEMPT\`"
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- checksums.txt SHA-256: \`$EXPECTED_CHECKSUMS_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    name: Publish npm packages
    if: ${{ inputs.publish_npm }}
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_CHECKSUMS_SHA256: ${{ inputs.expected_checksums_sha256 }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin trusted-publishing npm client
        run: npm install --global npm@11.19.0
      - name: Download and verify the promoted release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "invalid release version: $version" >&2
            exit 1
          fi
          expected_checksums_sha256="$(printf '%s' "$INPUT_CHECKSUMS_SHA256" | tr '[:upper:]' '[:lower:]')"
          mkdir release
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --dir release
          actual_checksums_sha256="$(sha256sum release/checksums.txt | cut -d' ' -f1)"
          if [ "$actual_checksums_sha256" != "$expected_checksums_sha256" ]; then
            echo "promoted checksums.txt digest mismatch" >&2
            exit 1
          fi
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 14
          test "$(wc -l < release/checksums.txt)" -eq 13
          (cd release && sha256sum --strict -c checksums.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish platform packages before the root package
        shell: bash
        run: |
          set -euo pipefail
          dist_tag=latest
          if [[ "$VERSION" == *-* ]]; then
            dist_tag=next
          fi

          packages=(
            "@factor-i-o/light-tools-darwin-arm64"
            "@factor-i-o/light-tools-darwin-x64"
            "@factor-i-o/light-tools-linux-arm64"
            "@factor-i-o/light-tools-linux-x64"
            "@factor-i-o/light-tools-win32-arm64"
            "@factor-i-o/light-tools-win32-x64"
            "@factor-i-o/light-tools"
          )
          tarballs=(
            "factor-i-o-light-tools-darwin-arm64-${VERSION}.tgz"
            "factor-i-o-light-tools-darwin-x64-${VERSION}.tgz"
            "factor-i-o-light-tools-linux-arm64-${VERSION}.tgz"
            "factor-i-o-light-tools-linux-x64-${VERSION}.tgz"
            "factor-i-o-light-tools-win32-arm64-${VERSION}.tgz"
            "factor-i-o-light-tools-win32-x64-${VERSION}.tgz"
            "factor-i-o-light-tools-${VERSION}.tgz"
          )

          publish_one() {
            package="$1"
            # ./ prefix is REQUIRED: npm-package-arg reads a bare "release/x.tgz"
            # as a GitHub owner/repo shorthand and tries to git-clone it. A local
            # tarball path must start with ./ ../ / or ~/ to be treated as a file.
            tarball="./release/$2"
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
            if registry_integrity="$(npm view "$package@$VERSION" dist.integrity 2>/dev/null)"; then
              if [ "$registry_integrity" != "$local_integrity" ]; then
                echo "immutable npm version has different bytes: $package@$VERSION" >&2
                echo "expected $local_integrity, got $registry_integrity" >&2
                exit 1
              fi
              echo "already published byte-identical: $package@$VERSION"
              return
            fi
            npm publish --access public --tag "$dist_tag" "$tarball"
          }

          for index in "${!packages[@]}"; do
            publish_one "${packages[$index]}" "${tarballs[$index]}"
          done

          {
            echo "### npm publication complete"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Dist-tag: \`$dist_tag\`"
            echo "- Packages: seven, platform-first and root-last"
          } >> "$GITHUB_STEP_SUMMARY"